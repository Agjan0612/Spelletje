<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dorp tot Stad — middeleeuwse city builder</title>
<!-- Favicon als inline SVG: geen extra bestand en dus ook geen mislukte
     request naar favicon.ico, waar de browser anders altijd om vraagt. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏰</text></svg>">
<!-- Titelfont (Cinzel): geeft koppen een eigen, uitgehouwen letter. Laadt via
     Google Fonts; valt bij offline of blokkade netjes terug op de serif-stack
     hieronder, dus het spel blijft zonder de font gewoon werken. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- ===== Bovenbalk ===== -->
  <header id="hud">
    <div id="hud-left">
      <div class="crest">🏰</div>
      <div class="townmeta">
        <div id="townname">Nieuw Dorp</div>
        <div id="agename" class="sub">Tijdperk 1 — Nederzetting</div>
      </div>
    </div>

    <div id="hud-res">
      <div id="res-primary" class="resrow"></div>
      <div id="res-secondary" class="resrow small"></div>
    </div>

    <div id="hud-right">
      <!-- Vier cijfers die je altijd wilt zien. De uitleg zit in de tooltip
           (js/ui/tip.js), niet in een title-attribuut, en het schild komt pas
           in beeld zodra er rovers kunnen komen. -->
      <div id="stats">
        <div class="stat" id="stat-pop" tabindex="0"><span class="ico">👥</span><span class="val">0</span></div>
        <div class="stat" id="stat-voedsel" tabindex="0"><span class="ico">🍞</span><span class="val">0d</span></div>
        <div class="stat" id="stat-happy" tabindex="0"><span class="ico">😀</span><span class="val">0%</span></div>
        <div class="stat hidden" id="stat-def" tabindex="0"><span class="ico">🛡️</span><span class="val">0</span></div>
        <div class="stat" id="stat-season" tabindex="0"><span class="ico">🌱</span><span class="val">Lente, jaar 1</span></div>
      </div>
      <div id="speeds">
        <button class="spd" data-speed="0" title="Pauze (spatie)">⏸</button>
        <button class="spd active" data-speed="1" title="Normale snelheid (1)">1×</button>
        <button class="spd" data-speed="2" title="Snel (2)">2×</button>
        <button class="spd" data-speed="4" title="Zeer snel (3)">4×</button>
      </div>
      <div id="hud-knoppen">
        <button id="btn-sound" title="Geluid uit">🔊</button>
        <button id="btn-menu" title="Menu (Esc)">☰</button>
      </div>
    </div>
  </header>

  <!-- ===== Speelveld ===== -->
  <main id="stage">
    <canvas id="canvas"></canvas>

    <div id="ghost-info" class="hidden"></div>

    <!-- Rechterkolom: één kaart met drie tabbladen. Drie kaarten onder elkaar
         pasten niet op het scherm, dus stond de onderste altijd half buiten
         beeld. De adviesregel staat erboven en blijft dus altijd zichtbaar. -->
    <aside id="right-col">
      <div id="advies" class="advies"></div>

      <div id="col-tabs" role="tablist">
        <button data-pane="agebox" class="active" role="tab">⚑ Tijdperk<i class="stip hidden"></i></button>
        <button data-pane="questbox" role="tab">🎯 Doelen<i class="stip hidden"></i></button>
        <button data-pane="stadbox" role="tab">🏛️ Stad<i class="stip hidden"></i></button>
      </div>

      <section id="agebox" class="card pane">
        <h3>Volgend tijdperk <span id="age-next-name"></span></h3>
        <ul id="age-reqs"></ul>
        <button id="btn-advance" disabled>Bevorder tijdperk</button>
      </section>

      <section id="questbox" class="card pane hidden">
        <ul id="quest-list"></ul>
      </section>

      <section id="stadbox" class="card pane hidden">
        <div id="stad-inhoud"></div>
        <div class="knoprij stadknoppen">
          <button id="btn-feest" title="Een feest geven">🎉 Feest</button>
          <button id="btn-onderzoek" title="Onderzoek in de universiteit">📚 Onderzoek</button>
          <button id="btn-overzicht" title="Overzicht: wat staat er stil?">📋 Overzicht</button>
        </div>
      </section>
    </aside>

    <!-- Selectiepaneel -->
    <aside id="panel" class="card hidden"></aside>

    <!-- Log -->
    <button id="log-toggle" title="Logboek inklappen">▾</button>
    <div id="logbox"></div>

    <!-- Kaartlagen -->
    <div id="lagenbalk"></div>
    <div id="lagen-legenda" class="hidden"></div>

    <!-- Minimap -->
    <canvas id="minimap" title="Klik om de camera te verplaatsen"></canvas>

    <!-- Waarschuwing voor rovers -->
    <div id="raid-warning" class="hidden"></div>

    <!-- Meldingen midden in beeld -->
    <div id="toast" class="hidden"></div>
  </main>

  <!-- ===== Bouwmenu ===== -->
  <footer id="buildbar">
    <div id="build-tabs"></div>
    <div id="build-list"></div>
  </footer>

</div>

<!-- ===== Overlays ===== -->
<div id="overlay" class="hidden">
  <!-- Titel-achtergrond: alleen zichtbaar op het welkomstscherm (#overlay.titel).
       Een geanimeerde middeleeuwse skyline achter de welkomstkaart — puur CSS/SVG,
       los van de spelstaat, zodat de eerste indruk er meteen staat. -->
  <div id="titel-achtergrond" aria-hidden="true">
    <div class="t-lucht"></div>
    <div class="t-zon"></div>
    <div class="t-wolk w1"></div>
    <div class="t-wolk w2"></div>
    <div class="t-wolk w3"></div>
    <svg class="t-vogels" viewBox="0 0 400 120" preserveAspectRatio="xMidYMid meet">
      <g fill="none" stroke="#2a2118" stroke-width="2" stroke-linecap="round">
        <path class="v1" d="M0 20 L8 26 L16 20"/>
        <path class="v2" d="M0 20 L7 25 L14 20"/>
        <path class="v3" d="M0 20 L9 27 L18 20"/>
      </g>
    </svg>
    <svg class="t-silhouet" viewBox="0 0 1200 340" preserveAspectRatio="xMidYMax slice">
      <!-- verre heuvel -->
      <path class="heuvel-ver" d="M0 220 Q300 170 600 205 T1200 200 V340 H0 Z"/>
      <!-- stadssilhouet -->
      <g class="stad">
        <!-- huisjes links -->
        <path d="M120 300 V245 L150 220 L180 245 V300 Z"/>
        <path d="M175 300 V255 L205 232 L235 255 V300 Z"/>
        <!-- molen -->
        <path d="M280 300 V232 L300 220 L320 232 V300 Z"/>
        <g class="molen-wieken" transform="translate(300 226)">
          <path d="M0 0 L34 0 M0 0 L-34 0 M0 0 L0 34 M0 0 L0 -34" stroke="#241a10" stroke-width="4" stroke-linecap="round"/>
        </g>
        <!-- kerk met spits -->
        <path d="M430 300 V210 H500 V300 Z"/>
        <path d="M430 210 L465 150 L500 210 Z"/>
        <path d="M462 150 V132 M453 141 H473" stroke="#241a10" stroke-width="4"/>
        <!-- burcht-toren midden -->
        <path d="M560 300 V180 H620 V180 L620 168 L611 168 L611 176 L602 176 L602 168 L593 168 L593 176 L584 176 L584 168 L575 168 L575 176 L566 176 L566 168 L560 168 Z"/>
        <path d="M620 300 V205 H660 V205 L660 195 L653 195 L653 202 L646 202 L646 195 L639 195 L639 202 L632 202 L632 195 L625 195 L625 202 L620 202 Z"/>
        <!-- vlag op de toren -->
        <g class="stad-vlag" transform="translate(590 168)">
          <path d="M0 0 V-26" stroke="#241a10" stroke-width="3"/>
          <path class="doek" d="M0 -26 L22 -20 L0 -14 Z" fill="#8c3326"/>
        </g>
        <!-- huisjes rechts -->
        <path d="M720 300 V250 L748 228 L776 250 V300 Z"/>
        <path d="M800 300 V240 L832 216 L864 240 V300 Z"/>
        <path d="M880 300 V258 L906 236 L932 258 V300 Z"/>
        <!-- poorttoren rechts -->
        <path d="M980 300 V200 H1030 V200 L1030 190 L1023 190 L1023 197 L1016 197 L1016 190 L1009 190 L1009 197 L1002 197 L1002 190 L995 190 L995 197 L988 197 L988 190 L980 190 Z"/>
        <path d="M1080 300 V255 L1108 232 L1136 255 V300 Z"/>
      </g>
    </svg>
    <div class="t-mist"></div>
    <div class="t-vignet"></div>
  </div>
  <div id="overlay-card">
    <h2 id="overlay-title"></h2>
    <div id="overlay-body"></div>
    <div id="overlay-actions"></div>
  </div>
</div>

<!-- Eén module-entry. Vite bundelt PixiJS en de bestaande IIFE-modules
     (die volgorde staat in src/legacy.js) plus de nieuwe Pixi-renderlaag.
     De laadvolgorde is dezelfde afhankelijkheidsvolgorde als voorheen. -->
<script type="module" src="/src/main.js"></script>
</body>
</html>
