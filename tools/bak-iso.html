<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Iso-sprites bakken — Dorp tot Stad</title>
<!--
  Bakt de procedurele gebouwvolumes uit js/render/sprites.js uit tot losse
  PNG's, op een veelvoud van de grootste zoom die de camera toelaat.

  Waarvoor dit is
  ---------------
  js/render/atlas.js heeft een haak (`A.isoGebouwMap`) waarmee één gebouw kan
  worden overgezet op echte, getekende iso-kunst in assets/iso/, met terugval op
  het procedurele volume zodra het bestand ontbreekt of nog laadt. Die haak is
  leeg, en dat is met opzet: geschilderde kunst is een besluit, geen taak.

  Wat dit gereedschap doet is dat besluit *begaanbaar* maken. Het levert per
  gebouw een PNG die precies het volume is dat het spel nu tekent, op ruime
  resolutie en met transparante achtergrond — het canvas waar een tekenaar
  overheen werkt, in plaats van een leeg vel en giswerk over de projectie.
  Bakken en meteen terugladen verandert het beeld dus niet; het is het
  beginpunt, niet de verbetering.

  Gebruik
  -------
  Open dit bestand rechtstreeks in een browser (file:// werkt, net als het spel
  zelf). Kies een schaal en een tijdperk, klik "Bakken", en sla de PNG's op in
  assets/iso/. Zet daarna per gebouw een regel in A.isoGebouwMap:

      A.isoGebouwMap = { stadhuis: 'stadhuis' };

  Begin met de vier gebouwen die groot en uniek zijn en altijd in beeld staan:
  dorpsplein, kathedraal, kasteel, stadhuis. De rest van het dorp blijft
  procedureel; dat mengt beter dan je denkt zolang het materiaal op elkaar is
  afgestemd, en als het niet mengt is de haak per gebouw, dus je kunt terug.
-->
<style>
  body { font: 14px/1.5 system-ui, sans-serif; background: #241a12; color: #e8dcc4; margin: 0; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { max-width: 62em; color: #c8b892; }
  .balk { margin: 16px 0; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  label { display: flex; gap: 6px; align-items: center; }
  button { font: inherit; padding: 6px 14px; background: #d7a94b; border: 0; border-radius: 4px; cursor: pointer; }
  #uit { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  figure { margin: 0; background: #2f2318; border: 1px solid #4a3826; border-radius: 6px; padding: 6px; text-align: center; }
  figure img { display: block; image-rendering: auto; background:
      repeating-conic-gradient(#3a2d20 0 25%, #2f2318 0 50%) 0 0 / 16px 16px; }
  figcaption { font-size: 11px; color: #c8b892; margin-top: 4px; }
  a { color: #f0c775; }
</style>
</head>
<body>

<h1>Iso-sprites bakken</h1>
<p>
  Rendert elk gebouw uit <code>js/config/buildings.js</code> als losse PNG met
  transparante achtergrond, in dezelfde projectie die het spel gebruikt. Sla ze
  op in <code>assets/iso/</code> en registreer ze in <code>A.isoGebouwMap</code>
  in <code>js/render/atlas.js</code>. Zie de opmerking bovenin dit bestand.
</p>

<div class="balk">
  <label>Pixels per tegel
    <input id="p" type="number" value="264" min="44" max="600" step="4">
  </label>
  <label>Tijdperk
    <select id="tijdperk"><option>1</option><option>2</option><option>3</option><option selected>4</option></select>
  </label>
  <label>Seizoen
    <select id="seizoen">
      <option value="0" selected>lente</option><option value="1">zomer</option>
      <option value="2">herfst</option><option value="3">winter</option>
    </select>
  </label>
  <button id="bak">Bakken</button>
  <button id="controle">Rondgang controleren</button>
  <span id="stand"></span>
</div>

<div id="uit"></div>

<!-- Alleen wat het tekenen nodig heeft: geen simulatie, geen UI, en met opzet
     géén js/render/atlas.js. Twee redenen: sprites.tekenGebouw geeft een al
     geregistreerde iso-sprite voorrang op het volume, dus mét de atlas zou dit
     gereedschap een sprite uit een sprite bakken zodra de haak eenmaal gevuld
     is; en de atlas laadt zijn Kenney-bestanden relatief aan de pagina, wat
     vanuit tools/ niet klopt. tekenGebouw valt netjes terug als de atlas er
     niet is. -->
<script src="../js/namespace.js"></script>
<script src="../js/config/resources.js"></script>
<script src="../js/config/jobs.js"></script>
<script src="../js/config/buildings.js"></script>
<script src="../js/render/camera.js"></script>
<script src="../js/render/beweging.js"></script>
<script src="../js/render/sfeer.js"></script>
<script src="../js/render/sprites.js"></script>
<script>
(function () {
  var uit = document.getElementById('uit');
  var stand = document.getElementById('stand');

  document.getElementById('bak').addEventListener('click', function () {
    var p = Math.max(44, +document.getElementById('p').value || 264);
    var tijdperk = +document.getElementById('tijdperk').value;
    var seizoen = +document.getElementById('seizoen').value;

    uit.innerHTML = '';
    var lijst = Game.config.buildingList.filter(function (d) { return !d.weg; });
    var n = 0;

    lijst.forEach(function (def) {
      var grootte = def.grootte || 1;

      /* The geometry is not free to choose: tekenGebouwSprite draws the image
         at width `p * grootte * 1.5`, centred on the footprint, with the
         image's *bottom edge* on the footprint's front corner. So a sprite is
         only correct if its footprint diamond is exactly two thirds of the
         image width, centred, with its front corner on the bottom edge.

         Getting this wrong is not subtle and it is not visible in the PNG: the
         first version of this tool used a canvas 0.6 tiles wider than the
         footprint with the corner 0.3 tiles above the bottom, and a baked
         cathedral came back into the game 35% too wide and 47% too tall. The
         round-trip test in the console below is here so that can never happen
         again quietly. */
      var breed = Math.round(p * grootte * 1.5);
      var hoogVrij = Math.ceil(p * 2.8);          /* room for the tallest spire */
      var hoog = Math.ceil(p * grootte * 0.5 + hoogVrij);

      var doek = document.createElement('canvas');
      doek.width = breed;
      doek.height = hoog;
      var ctx = doek.getContext('2d');

      var sx = breed / 2;
      var sy = hoog - p * grootte * 0.5;          /* front corner on the bottom edge */

      try {
        Game.render.sprites.tekenGebouw(ctx, def, sx, sy, p, grootte, {
          tijd: 0, tijdperk: tijdperk, seizoen: seizoen, zaad: 7, nacht: false,
          nachtF: 0, toonBordje: false,
          /* No ground shadow in the image: the game lays down its own, and one
             that still follows the hour. */
          zonderSchaduw: true
        });
      } catch (e) {
        console.warn('kon ' + def.id + ' niet bakken:', e);
        return;
      }

      /* Trim empty rows off the *top* only. The bottom and the sides carry the
         anchoring, so they must stay; the height is free, because the drawn
         height follows the image's aspect ratio from a bottom anchor. */
      doek = trimBoven(doek);

      var fig = document.createElement('figure');
      var img = document.createElement('img');
      var url = doek.toDataURL('image/png');
      img.src = url;
      img.width = Math.min(190, breed);
      var link = document.createElement('a');
      link.href = url;
      link.download = def.id + '.png';
      link.textContent = def.id + '.png';
      fig.appendChild(img);
      var cap = document.createElement('figcaption');
      cap.appendChild(link);
      fig.appendChild(cap);
      uit.appendChild(fig);
      n++;
    });

    stand.textContent = n + ' van ' + lijst.length + ' gebakken op ' + p + ' px/tegel.';
  });

  /* --------------------------------------------------------------- rondgang

     The self-check, in the spirit of js/devcheck.js: bake a building, draw the
     bake back through the game's own sprite path, and compare where the ink
     lands against the procedural volume. If those two boxes do not agree, this
     tool is producing templates that will not line up — which is invisible in
     the PNG itself and only shows up once art has already been painted on it.
     It has been wrong once. */
  document.getElementById('controle').addEventListener('click', function () {
    var S = Game.render.sprites;
    var p = 88, fouten = [], gedaan = 0;
    var proeven = ['huisje', 'stadhuis', 'kathedraal', 'kasteel'];

    proeven.forEach(function (id) {
      var def = Game.config.gebouw(id);
      if (!def) return;
      var grootte = def.grootte || 1;
      /* Both sides without ground shadows: this is a test of *geometry*, and
         the volume and the sprite path each estimate a building's height for
         their shadow in their own way, which would drown the thing being
         measured in noise that is not a fault. */
      var opties = { tijd: 0, tijdperk: 4, seizoen: 0, zaad: 7, zonderSchaduw: true };

      var A = leegDoek(760, 760);
      S.tekenGebouw(A.getContext('2d'), def, 380, 460, p, grootte, opties);

      var breed = Math.round(p * grootte * 1.5);
      var hoog = Math.ceil(p * grootte * 0.5 + p * 2.8);
      var bak = leegDoek(breed, hoog);
      S.tekenGebouw(bak.getContext('2d'), def, breed / 2, hoog - p * grootte * 0.5,
                    p, grootte, { tijd: 0, tijdperk: 4, seizoen: 0, zaad: 7, zonderSchaduw: true });
      bak = trimBoven(bak);

      var img = new Image();
      img.onload = function () {
        var echt = Game.render.atlas && Game.render.atlas.isoGebouw;
        Game.render.atlas = Game.render.atlas || {};
        Game.render.atlas.isoGebouw = function (q) { return q === id ? img : null; };
        var B = leegDoek(760, 760);
        S.tekenGebouw(B.getContext('2d'), def, 380, 460, p, grootte, opties);
        if (echt) Game.render.atlas.isoGebouw = echt; else delete Game.render.atlas.isoGebouw;

        var a = kader(A), b = kader(B);
        var af = Math.max(Math.abs(a.x0 - b.x0), Math.abs(a.y0 - b.y0),
                          Math.abs(a.x1 - b.x1), Math.abs(a.y1 - b.y1));
        if (!(af <= 3)) fouten.push(id + ': ' + af + ' px verschoven');
        if (++gedaan === proeven.length) {
          stand.textContent = fouten.length
            ? '❌ rondgang mislukt — ' + fouten.join('; ')
            : '✅ rondgang klopt: gebakken en teruggeladen komt op dezelfde plek.';
          stand.style.color = fouten.length ? '#f0907a' : '#9ad07a';
        }
      };
      img.src = bak.toDataURL();
    });
  });

  function leegDoek(b, h) {
    var c = document.createElement('canvas');
    c.width = b; c.height = h;
    return c;
  }

  /* Bounding box of everything that is not fully transparent. */
  function kader(doek) {
    var d = doek.getContext('2d').getImageData(0, 0, doek.width, doek.height).data;
    var x0 = 1e9, y0 = 1e9, x1 = -1, y1 = -1;
    for (var y = 0; y < doek.height; y++) {
      for (var x = 0; x < doek.width; x++) {
        if (d[(y * doek.width + x) * 4 + 3] > 24) {
          if (x < x0) x0 = x; if (x > x1) x1 = x;
          if (y < y0) y0 = y; if (y > y1) y1 = y;
        }
      }
    }
    return { x0: x0, y0: y0, x1: x1, y1: y1 };
  }

  /* Cut fully transparent rows off the top of a canvas. */
  function trimBoven(doek) {
    var c = doek.getContext('2d');
    var d;
    try { d = c.getImageData(0, 0, doek.width, doek.height).data; }
    catch (e) { return doek; }        /* tainted canvas: leave it be */
    var eerste = 0;
    zoek: for (var y = 0; y < doek.height; y++) {
      for (var x = 0; x < doek.width; x++) {
        if (d[(y * doek.width + x) * 4 + 3] > 2) { eerste = y; break zoek; }
      }
    }
    if (eerste < 2) return doek;
    var uit = document.createElement('canvas');
    uit.width = doek.width;
    uit.height = doek.height - eerste;
    uit.getContext('2d').drawImage(doek, 0, -eerste);
    return uit;
  }
})();
</script>
</body>
</html>
